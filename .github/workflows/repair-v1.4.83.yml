name: Repair and release v1.4.83

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-v1.4.83.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-v1.4.83
  cancel-in-progress: false

jobs:
  repair-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply deterministic repairs
        run: python3 .github/scripts/apply-v1.4.83.py

      - name: Setup Node.js 24.20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: matter-all-in-one-addon/package-lock.json

      - name: Synchronize package lock
        working-directory: matter-all-in-one-addon
        run: npm install --package-lock-only --legacy-peer-deps --no-fund --no-audit

      - name: Install dependencies
        working-directory: matter-all-in-one-addon
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Typecheck
        working-directory: matter-all-in-one-addon
        run: npm run typecheck

      - name: Unit tests
        working-directory: matter-all-in-one-addon
        run: npm run test

      - name: Build plugin
        working-directory: matter-all-in-one-addon
        run: npm run build

      - name: Verify release invariants
        run: |
          set -euo pipefail
          grep -q 'ARG BUILD_FROM=node:24.20.0' matter-all-in-one-addon/Dockerfile
          grep -q 'node-version:.*24.20' .github/workflows/build.yml
          grep -q 'node-version:.*24.20' .github/workflows/publish.yml
          grep -q 'transport !== "auto"' matter-all-in-one-addon/src/camera/homekit/ffmpeg-helper.ts
          grep -q 'FFmpeg survived startup guard' matter-all-in-one-addon/src/camera/homekit/homekit-camera-stream.delegate.ts
          grep -q 'let activeCamQrMode = "homekit"' matter-all-in-one-addon/src/frontend/script.js
          grep -q 'computeHomeKitSetupUri' matter-all-in-one-addon/src/frontend/script.js
          ! grep -q 'ABCD-1234-EFGH' matter-all-in-one-addon/src/frontend/script.js
          test "$(node -p "require('./matter-all-in-one-addon/package.json').version")" = "1.4.83"

      - name: Build Docker image
        run: docker build --tag matter-all-in-one:v1.4.83 matter-all-in-one-addon

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml .github/workflows/publish.yml matter-all-in-one-addon README.md
          git commit -m "fix(camera): HAP Live View pipeline and Node 24.20 LTS (v1.4.83)"
          git push origin HEAD:main

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a v1.4.83 -m "v1.4.83 - HAP Live View and Node 24.20 LTS"
          git push origin v1.4.83
          gh release create v1.4.83 --verify-tag \
            --title "v1.4.83 - HAP Live View and Node 24.20 LTS" \
            --notes "Node.js 24.20 LTS; refreshed Scrypted HAP stream sources; valid RTSP transport handling; FFmpeg startup guard; H.264 SPS/PPS keyframes; HAP QR for Apple Home; Matter Camera remains separate and experimental. Typecheck, unit tests, plugin build and Docker build completed before this release. Creating this release triggers the existing Publish to NPM workflow. Physical Apple Home and Scrypted runtime validation remains required."
