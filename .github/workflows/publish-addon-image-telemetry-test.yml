name: Publish Home Assistant add-on image (telemetry test)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish-test:
    name: Build and publish telemetry test image
    if: github.ref == 'refs/heads/feature/camera-telemetry-2k'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify test version
        id: metadata
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?$/\1/p' matter-all-in-one-addon/config.yaml)"
          test "$version" = "1.8.92"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af63523ba5f55733d817da0fdb813e660152c72c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push only the telemetry test image
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: ./matter-all-in-one-addon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:${{ steps.metadata.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Matter All-in-One Bridge (telemetry test)
            org.opencontainers.image.source=https://github.com/Chrisalvir1/matter-all-in-one-chrisalvir
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}

      - name: Verify exact published test tag
        run: docker buildx imagetools inspect "ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:${{ steps.metadata.outputs.version }}"
