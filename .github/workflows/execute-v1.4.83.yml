name: Execute v1.4.83 repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/execute-v1.4.83.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repair-v1.4.83.yml --repo "${{ github.repository }}" --ref main
