name: Publish Home Assistant add-on image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-addon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  validate-tag:
    name: Validate exact release source
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: matter-all-in-one-addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install validated npm
        run: npm install --global npm@12.2.1 --no-fund --no-audit

      - run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Verify synchronized toolchain
        run: npm run check:toolchain
      - run: node scripts/verify-ha-changelog.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  native-container-smoke:
    needs: validate-tag
    name: Native container validation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build without publishing
        working-directory: matter-all-in-one-addon
        run: docker build --pull --platform linux/${{ matrix.arch }} --tag matter-native:ci .
      - name: Verify image and production services
        run: |
          test "$(docker image inspect matter-native:ci --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          docker run --rm --network none --entrypoint node matter-native:ci scripts/verify-runtime.mjs
          docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg matter-native:ci -version
          docker run --rm --network none --entrypoint ffprobe matter-native:ci -version

  build-and-publish:
    needs: [validate-tag, native-container-smoke]
    name: Build multi-arch image and publish to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up validated Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Read add-on version
        id: metadata
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?$/\1/p' matter-all-in-one-addon/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Home Assistant changelog matches published version
        working-directory: matter-all-in-one-addon
        run: node scripts/verify-ha-changelog.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./matter-all-in-one-addon
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
          push: true
          tags: |
            ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:${{ steps.metadata.outputs.version }}
            ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:latest
          labels: |
            io.hass.type=app
            io.hass.name=Matter All-in-One Bridge
            io.hass.description=Expose Home Assistant entities through one stable Matter bridge with HomeKit-compatible mappings.
            org.opencontainers.image.source=https://github.com/Chrisalvir1/matter-all-in-one-chrisalvir
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}

  verify-public:
    name: Verify Home Assistant can download the image
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image without registry credentials
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:${{ needs.build-and-publish.outputs.version }}"; then
              echo "GHCR package ${{ needs.build-and-publish.outputs.version }} is public and accessible!"
              exit 0
            fi
            echo "Public image verification attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "::error::The GHCR package is not public. Open the package settings, choose Change visibility, and make it Public so Home Assistant can download it."
          exit 1

  publish-github-release:
    name: Publish GitHub release after the HA image is verified
    needs: verify-public
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_${VERSION}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping its existing notes."
          elif test -f "$NOTES"; then
            gh release create "$GITHUB_REF_NAME" --title "Matter All-in-One $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "Matter All-in-One $GITHUB_REF_NAME" --generate-notes
          fi
