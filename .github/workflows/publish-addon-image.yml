name: Publish Home Assistant add-on image

on:
  workflow_dispatch:

concurrency:
  group: publish-addon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build multi-arch image and publish to GHCR
    if: github.ref == 'refs/heads/feature/camera-telemetry-2k'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read add-on version
        id: metadata
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?$/\1/p' matter-all-in-one-addon/config.yaml)"
          test "$version" = "1.8.92"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Calculate and validate test image tags
        id: image-tags
        run: |
          version="${{ steps.metadata.outputs.version }}"
          image="ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir"
          tags=("${image}:${version}")
          echo "Tags calculados antes de publicar:"
          printf '  %s\n' "${tags[@]}"
          if printf '%s\n' "${tags[@]}" | grep -Eq '(^|:)latest$'; then
            echo "::error::Se detectó el tag prohibido :latest; se cancela antes del push de la imagen."
            exit 1
          fi
          if [ "${#tags[@]}" -ne 1 ] || [ "${tags[0]}" != "${image}:1.8.92" ]; then
            echo "::error::La lista de tags no coincide exactamente con ${image}:1.8.92."
            exit 1
          fi
          image_tag="${tags[0]}"
          test -n "$image_tag"
          test "$image_tag" != "${image}:latest"
          test "$image_tag" = "${image}:1.8.92"
          echo "image_tag=${tags[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af63523ba5f55733d817da0fdb813e660152c72c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@2ca78c6bec76527009825f31aae0532b4d40d820
        with:
          context: ./matter-all-in-one-addon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.image_tag }}
          labels: |
            io.hass.type=app
            io.hass.name=Matter All-in-One Bridge
            io.hass.description=Expose Home Assistant entities through one stable Matter bridge with HomeKit-compatible mappings.
            org.opencontainers.image.source=https://github.com/Chrisalvir1/matter-all-in-one-chrisalvir
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}

  verify-public:
    name: Verify Home Assistant can download the image
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image without registry credentials
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "ghcr.io/chrisalvir1/matter-all-in-one-chrisalvir:${{ needs.build-and-publish.outputs.version }}"; then
              echo "GHCR package ${{ needs.build-and-publish.outputs.version }} is public and accessible!"
              exit 0
            fi
            echo "Public image verification attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo "::error::The GHCR package is not public. Open the package settings, choose Change visibility, and make it Public so Home Assistant can download it."
          exit 1
