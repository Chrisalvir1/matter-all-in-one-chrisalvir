name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.20.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee /tmp/v1.4.84-typecheck.txt

      - name: Report typecheck result on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/v1.4.84-typecheck.txt').read_text(errors='replace')[-50000:]
          Path('/tmp/v1.4.84-comment.txt').write_text('## v1.4.84 isolated typecheck\n\n```text\n' + text + '\n```\n')
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/v1.4.84-comment.txt

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Build add-on container
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
        run: docker build --tag matter-all-in-one:test .
