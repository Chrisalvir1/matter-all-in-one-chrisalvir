name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.21.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Verify Matterbridge and WebRTC dependency versions
        run: npm ls --depth=0 matterbridge werift @homebridge/hap-nodejs

      - name: Build add-on container
        if: matrix.os == 'ubuntu-latest'
        run: docker build --tag matter-all-in-one:test .

  home-assistant-core-compatibility:
    name: Home Assistant Core 2026.10.0 websocket contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: home-assistant/core
          ref: 2026.10.0
          path: home-assistant-core
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.2'
      - name: Install Home Assistant Core 2026.10.0 test dependencies
        run: |
          python -m pip install uv==0.12.19
          cd home-assistant-core
          uv pip install --system -r requirements.txt -r requirements_test.txt
          uv pip install --system -e . --no-deps
      - name: Verify websocket API contract
        run: python -m pytest -q tests_core
