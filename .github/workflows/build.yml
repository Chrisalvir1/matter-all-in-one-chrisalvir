name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.19.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Build add-on container
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
        run: docker build --tag matter-all-in-one:test .
