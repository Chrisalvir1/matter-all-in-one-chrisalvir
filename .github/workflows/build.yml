name: Build and Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.20.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Synchronize package lock metadata
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-fund --no-audit
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(release): synchronize v1.4.84 package lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Build add-on container
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'push'
        run: docker build --tag matter-all-in-one:test .
