name: Build and Test

on:
  push:
    branches: [main, codex/stable-dependencies-node26]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon

    strategy:
      fail-fast: false
      matrix:
        node-version: [26.13.0]
        os: [ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install validated npm
        run: npm install --global npm@12.2.1 --no-fund --no-audit

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Verify synchronized toolchain
        run: npm run check:toolchain

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Verify Matterbridge and WebRTC dependency versions
        run: npm ls --depth=0 matterbridge werift @homebridge/hap-nodejs

      - name: Build add-on container
        if: matrix.os == 'ubuntu-24.04'
        run: |
          docker build --tag matter-all-in-one:test .
          docker run --rm --network none --entrypoint node matter-all-in-one:test scripts/verify-runtime.mjs
          docker run --rm --network none --entrypoint /usr/local/bin/ffmpeg matter-all-in-one:test -version
          docker run --rm --network none --entrypoint ffprobe matter-all-in-one:test -version

  home-assistant-core-compatibility:
    name: Home Assistant Core 2026.11.0b3 websocket contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: 2026.11.0b3
          path: home-assistant-core
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install Home Assistant Core 2026.11.0b3 test dependencies
        run: |
          python -m pip install uv==0.13.6
          cd home-assistant-core
          uv pip install --system -r requirements.txt -r requirements_test.txt
          uv pip install --system -e . --no-deps
      - name: Verify websocket API contract
        run: python -m pytest -q tests_core
