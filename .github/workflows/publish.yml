name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:

# Keep manual retries and release-triggered publishes from racing each other.
concurrency:
  group: npm-publish-matter-all-in-one-addon
  cancel-in-progress: false

permissions:
  contents: read
  # npm trusted publishing uses the short-lived GitHub Actions OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.13.0 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: './matter-all-in-one-addon/package-lock.json'

      - name: Verify npm CLI supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          NPM_VERSION="$NPM_VERSION" node -e 'const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("Trusted publishing requires npm >=11.5.1")'

      - name: Remove deprecated npm config
        run: npm config delete always-auth --location=user || true

      - name: Install validated npm
        run: npm install --global npm@12.2.2 --no-fund --no-audit

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Verify synchronized toolchain
        run: npm run check:toolchain

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Verify add-on version and release notes
        run: node scripts/verify-ha-changelog.mjs

      - name: Publish to NPM using trusted OIDC identity
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "matter-all-in-one-addon@$CURRENT_VERSION" version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published to npm. Skipping."
          else
            npm publish --provenance --access public
          fi
