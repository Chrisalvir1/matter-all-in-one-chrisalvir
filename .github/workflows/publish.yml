name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./matter-all-in-one-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '26.8.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: './matter-all-in-one-addon/package-lock.json'

      - name: Remove deprecated npm config
        run: npm config delete always-auth --location=user || true

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build plugin
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Publish to NPM
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view matter-all-in-one-chrisalvir version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published to npm. Skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
