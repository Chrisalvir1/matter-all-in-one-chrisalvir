name: Diagnose v1.4.84 Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-v1.4.84.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture repair error
        id: diagnose
        shell: bash
        run: |
          set +e
          mkdir -p .github/diagnostics
          python3 .github/scripts/apply-v1.4.84-root-camera-fix-v2.py > .github/diagnostics/v1.4.84-apply.txt 2>&1
          status=$?
          {
            echo
            echo "exit_status=$status"
            echo "commit=$(git rev-parse HEAD)"
            echo "timestamp=$(date -u +%FT%TZ)"
          } >> .github/diagnostics/v1.4.84-apply.txt
          cat .github/diagnostics/v1.4.84-apply.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .github/diagnostics/v1.4.84-apply.txt
          git commit -m 'ci(camera): record v1.4.84 repair diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark failed after preserving output
        if: steps.diagnose.outputs.status != '0'
        run: exit 1
