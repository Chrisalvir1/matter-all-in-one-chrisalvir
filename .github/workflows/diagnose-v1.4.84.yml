name: Diagnose v1.4.84 Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-v1.4.84.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture and report exact repair error
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(python3 .github/scripts/apply-v1.4.84-root-camera-fix-v2.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          body=$(printf 'Automated diagnostic for commit `%s`.\n\nExit status: `%s`\n\n```text\n%s\n```\n' "$(git rev-parse HEAD)" "$status" "$output")
          existing=$(gh issue list --state open --search 'v1.4.84 repair diagnostic in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title 'v1.4.84 repair diagnostic' --body "$body"
          fi
          echo "Diagnostic reported. The workflow remains green intentionally; the exit status is in the issue."
