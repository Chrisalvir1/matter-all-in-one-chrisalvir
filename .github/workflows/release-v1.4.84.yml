name: Release v1.4.84

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.4.84.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-v1.4.84
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: matter-all-in-one-addon/package-lock.json

      - name: Install dependencies
        working-directory: matter-all-in-one-addon
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Validate source
        working-directory: matter-all-in-one-addon
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Verify release invariants
        run: |
          set -euo pipefail
          test "$(node -p "require('./matter-all-in-one-addon/package.json').version")" = "1.4.84"
          grep -q 'version: "1.4.84"' matter-all-in-one-addon/config.yaml
          grep -q 'CameraController.generateSynchronisationSource()' matter-all-in-one-addon/src/camera/homekit/homekit-camera-stream.delegate.ts
          grep -q 'localrtcpport=' matter-all-in-one-addon/src/camera/homekit/homekit-camera-stream.delegate.ts
          grep -q 'cameraStreamCount: 1' matter-all-in-one-addon/src/camera/homekit/homekit-camera.accessory.ts
          grep -q 'record.hksvEnabled = false' matter-all-in-one-addon/src/camera/homekit/homekit-camera.accessory.ts
          grep -q 'strategy: "transcode_required"' matter-all-in-one-addon/src/camera/scrypted/scrypted-homekit-bridge.ts

      - name: Build Docker image
        run: docker build --tag matter-all-in-one:v1.4.84 matter-all-in-one-addon

      - name: Create annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse v1.4.84 >/dev/null 2>&1; then
            echo "v1.4.84 already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.4.84 -m "v1.4.84 - Root HAP Live View session repair"
            git push origin v1.4.84
          fi
          if gh release view v1.4.84 >/dev/null 2>&1; then
            echo "Release v1.4.84 already exists"
          else
            gh release create v1.4.84 --verify-tag \
              --title "v1.4.84 - Root HAP Live View Session Repair" \
              --notes "Rebuilds the Scrypted-to-Apple Home production HAP camera bridge from the session layer: accessory-local RTCP ports, unique per-session SSRCs, correct remote/local port separation, IPv4/IPv6 SRTP with localrtcpport, exact Apple-negotiated H.264 dimensions/FPS/profile/level/bitrate/MTU, AAC-ELD audio, one production stream, HKSV/NVR disabled by default, stable Scrypted identity, valid JPEG fallback, and explicit SetupEndpoints/START/STOP diagnostics. Matter Camera remains experimental. Node.js and Docker use 24.20.0 LTS. Typecheck, 324 tests, build and Docker passed. Physical Apple Home validation on real cameras remains required before calling Live View proven."
